<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Team Balancer">
  <title>⚽ Team Balancer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>⚽ Team Balancer</h1>
    <button id="theme" class="icon-btn" title="Тема">🌙</button>
  </header>

  <main class="container">

    <!-- Быстрый ввод игрока -->
    <section class="card add-card">
      <label class="field-label" for="nameInput">Имя игрока</label>
      <input
        id="nameInput"
        class="name-input"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="words"
        enterkeyhint="done"
        placeholder="Например, Аня"
        maxlength="30">

      <div class="field-label" style="margin-top:14px">Уровень игры</div>
      <div class="level-buttons">
        <button class="level-btn lvl-1" data-level="1" type="button">
          <span class="lvl-num">1</span>
          <span class="lvl-text">слабый</span>
        </button>
        <button class="level-btn lvl-2" data-level="2" type="button">
          <span class="lvl-num">2</span>
          <span class="lvl-text">средний</span>
        </button>
        <button class="level-btn lvl-3" data-level="3" type="button">
          <span class="lvl-num">3</span>
          <span class="lvl-text">сильный</span>
        </button>
      </div>
      <div class="hint">Введи имя и коснись уровня — игрок добавится в список.</div>
      <div class="err" id="err"></div>
    </section>

    <!-- Список игроков -->
    <section class="card">
      <div class="list-header">
        <span>Игроки (<span id="count">0</span>/14)</span>
        <button class="link-btn" id="clear" type="button">Очистить</button>
      </div>
      <div id="players" class="players-list"></div>
      <div id="emptyHint" class="empty-hint">Пока никого нет. Добавь первого игрока выше ↑</div>
    </section>

    <button class="primary big" id="balance" type="button">Сбалансировать</button>

    <section id="result"></section>
  </main>

  <script src="balancer.js"></script>
  <script src="app.js"></script>
</body>
</html>
